<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="machine-transfer: one window frame handing off to another">
  <title>machine-transfer</title>
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="302" y1="648" x2="722" y2="928">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.25" stop-color="#fb923c"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="0.75" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="430" x2="0" y2="590">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- background: n-uf near-black -->
  <rect width="1024" height="1024" fill="#0a0a0c"/>

  <!-- source Mac: off-white window frame -->
  <g fill="none" stroke="#f2f2f0" stroke-width="34" stroke-linejoin="round" stroke-linecap="round">
    <rect x="302" y="96" width="420" height="280" rx="48"/>
    <path d="M302 184H722"/>
  </g>
  <circle cx="352" cy="140" r="14" fill="#f2f2f0"/>
  <circle cx="396" cy="140" r="14" fill="#f2f2f0"/>

  <!-- target Mac: accent-gradient window frame -->
  <g fill="none" stroke="url(#grad)" stroke-width="34" stroke-linejoin="round" stroke-linecap="round">
    <rect x="302" y="648" width="420" height="280" rx="48"/>
    <path d="M302 736H722"/>
  </g>
  <circle cx="352" cy="692" r="14" fill="#f472b6"/>
  <circle cx="396" cy="692" r="14" fill="#fb923c"/>

  <!-- handoff arrow -->
  <g fill="none" stroke="url(#arrow)" stroke-width="38" stroke-linejoin="round" stroke-linecap="round">
    <path d="M512 430V582"/>
    <path d="M452 526L512 586L572 526"/>
  </g>
</svg>
